<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>イラスト依頼フォーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 1列の細い「スケッチ用紙」。質問は1画面1問、上に進捗の目盛り、背景に薄いガイド線。 */
:root{
  color-scheme:light;
  --bg:#FFF3DF;
  --surface:#FFFBF3;
  --ink:#3A2A1E;
  --muted:#7B6450;
  --line:#EBD7BB;
  --line-strong:#C9A87E;
  --accent:#C4560A;
  --fill:#F59A3C;
  --accent-soft:#FFE2BD;
  --on-accent:#2E1F14;
  --grid:rgba(196,86,10,.07);
  --ok:#2F7A46;
  --ok-soft:#E3F1D9;
  --warn:#B3382A;
  --warn-soft:#FDE4D8;
  --rail:#EBD7BB;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
/* 明るいベージュとオレンジの1テーマに固定(ダークモードでも暗くならない) */
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;line-height:1.75;
  padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict;
}
button,input,textarea{font:inherit;color:inherit}
.shell{max-width:560px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{display:flex;gap:4px;margin-top:10px;height:5px}
.prog span{flex:1;border-radius:3px;background:var(--rail)}
.prog span.on{background:var(--fill)}
.prog[hidden],.top .count[hidden]{display:none!important}

/* step */
.step{margin-top:30px}
.enter{animation:rise .26s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.enter{animation:none}*{transition:none!important}}
.intro{margin:0 0 26px;color:var(--muted);font-size:15px}
.qno{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--accent)}
.qtitle{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,5.6vw,25px);line-height:1.5;margin:4px 0 0;text-wrap:balance}
.qtitle:focus{outline:none}
.qnote{margin:10px 0 0;font-size:14px;color:var(--muted)}
.qbody{margin-top:22px}

/* radio options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;
  transition:border-color .15s,background .15s}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;transition:border-color .15s}
.opt .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
.opt.is-on{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-on .dot{border-color:var(--accent)}
.opt.is-on .dot::after{transform:scale(1)}
.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.otxt{display:flex;flex-direction:column;min-width:0}
.otxt b{font-size:17px;font-weight:700;line-height:1.5}
.otxt small{font-size:13px;color:var(--muted);line-height:1.5}

/* nav */
.nav{display:flex;gap:12px;margin-top:30px}
.btn{min-height:50px;padding:0 22px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:16px;cursor:pointer;font-family:var(--font-body)}
.btn-primary{background:var(--fill);color:var(--on-accent);flex:1}
.btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-line{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-block{width:100%}
.link-btn{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* calendar */
.cal{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-title{font-family:var(--font-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.cal-nav{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:20px;cursor:pointer;line-height:1}
.cal-nav:disabled{opacity:.3;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}
.wd.sun{color:var(--warn)}.wd.sat{color:var(--accent)}
.day{aspect-ratio:1;min-height:40px;border-radius:10px;border:1.5px solid transparent;background:transparent;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.day:disabled{opacity:.3;cursor:not-allowed}
.day.today{border-color:var(--line-strong)}
.day.sel{background:var(--fill);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.picked{margin:14px 0 0;font-weight:700;font-size:16px}
.picked.empty{color:var(--muted);font-weight:400;font-size:14px}

/* text */
.ta{word-break:normal;overflow-wrap:break-word;width:100%;min-height:170px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.7;resize:vertical}
.ta:focus{border-color:var(--accent);outline:none}
.tcount{text-align:right;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.req{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}

/* attachments */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;padding:26px 16px;border:2px dashed var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;text-align:center}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop-t{font-weight:700;font-size:17px;color:var(--accent)}
.drop-s{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.th{position:relative;margin:0;min-width:0}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.th figcaption{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.th button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(10,18,32,.75);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.warnbox{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.infobox{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}

/* budget */
.bud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper{flex:none;width:54px;height:54px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:24px;cursor:pointer;line-height:1}
.bval{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,10vw,44px);font-variant-numeric:tabular-nums;letter-spacing:.01em;text-align:center;flex:1;min-width:0}
.slider{position:relative;--th:28px;height:50px;margin-top:18px}
.slider input[type=range]{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.slider input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--fill) var(--pct),var(--rail) var(--pct))}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-10px}
.slider input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--rail)}
.slider input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--fill)}
.slider input[type=range]::-moz-range-thumb{box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.band{position:absolute;top:38px;height:8px;border-radius:4px;border:1.5px solid var(--ok);background:var(--ok-soft);
  left:calc(var(--th)/2 + (100% - var(--th)) * var(--a));
  width:calc((100% - var(--th)) * (var(--b) - var(--a)))}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.guide{margin:16px 0 0;font-size:15px}
.rushnote{margin:0 0 18px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent-soft);font-size:14px;font-weight:700}
.guide i{display:inline-block;width:18px;height:8px;border-radius:4px;border:1.5px solid var(--ok);background:var(--ok-soft);margin-right:8px;vertical-align:middle}
.bstat{margin:6px 0 0;font-size:14px;font-weight:700}
.st-low{color:var(--warn)}.st-in{color:var(--ok)}.st-high{color:var(--muted)}

/* summary */
.sum{margin:0;padding:0;list-style:none;border-top:1.5px solid var(--line)}
.sum li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.sum .sk{font-size:12px;color:var(--muted);letter-spacing:.04em}
.sum .sv{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.65}
.sum .sc{min-width:0;flex:1}
.sum .link-btn{flex:none}
.terms{margin-top:28px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
.terms h3{margin:0 0 8px;font-family:var(--font-display);font-size:16px}
.terms ol{margin:0;padding-left:1.4em;max-height:230px;overflow:auto;font-size:14px;line-height:1.75}
.terms li{margin-bottom:6px}
.agree{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:700}
.agree input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* result / view */
.linkbox{width:100%;resize:none;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;word-break:break-all}
.textbox{font-family:var(--font-body);font-size:14px;line-height:1.7;word-break:normal;overflow-wrap:anywhere;resize:vertical}
.alt{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.alt summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--muted)}
.callout{margin-top:18px;padding:16px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft);font-size:15px}
.callout b{font-family:var(--font-display);font-size:17px;display:block;margin-bottom:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.est{padding:18px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin-top:18px}
.est .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.est .v{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1.3;font-variant-numeric:tabular-nums}
.est .g{font-size:14px;color:var(--muted)}
.pill{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700}
.pill.st-low{background:var(--warn-soft)}.pill.st-in{background:var(--ok-soft)}.pill.st-high{background:var(--accent-soft);color:var(--accent)}
.flow{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:f}
.flow li{counter-increment:f;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.flow li::before{content:counter(f);flex:none;width:26px;height:26px;margin-top:2px;border-radius:50%;background:var(--fill);color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:14px;display:grid;place-items:center}
.flow li div{min-width:0}
.flow b{display:block;font-size:15px;line-height:1.5}
.flow span{display:block;font-size:13px;color:var(--muted);line-height:1.6}
.sub{margin:22px 0 4px;font-family:var(--font-display);font-size:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">イラスト依頼フォーム</div>
    <div class="count" id="stepcount"></div>
  </header>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <main id="stage"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ====== 設定 ====== */
// 依頼料の目安(円)
const GUIDE = [7000,30000];
// 納期設定ごとに選べる日付(今日を0日目として数える)
const RANGE = {rush:[8,14],normal:[15,61],long:[62,Infinity]};
const SL_MIN = 1000, SL_MAX = 100000, SL_STEP = 1000;

// 納品物に関する利用規約
const TERMS = [
  '納品物の著作権は制作者に帰属します。依頼者には、事前に申告いただいた用途での利用を許諾します。',
  '申告用途以外での利用(グッズ化・商用配布・他者への譲渡など)をご希望の場合は、事前にご相談ください。',
  '納品物の無断転載・再配布、自作であるかのような発言は禁止します。',
  '納品物を生成AIの学習・生成の素材として利用することは禁止します。',
  '修正の対象は、ラフ・線画の段階までです。それ以降は修正できません。',
  '制作者は、納品物を実績としてポートフォリオやSNSに掲載する場合があります。掲載を控えたい場合は、備考欄にご記載ください。',
  '依頼者のSNS等活動において、差別的、非人道的な言動、問題行動を行わないこと。',
  'こちらから、納品物の利用禁止を通告された場合、納品物に関与するものは即座に利用を停止すること。'
];

const NOTICE = 'これは見積もりを行うためのアンケートであり、依頼を確定させるものではありません。';

/* ====== 選択肢 ====== */
const OPT = {
  type:[['standing','立ち絵','キャラクターが立っている姿を描いた絵'],['illust','1枚絵','背景や構図まで含めた1枚のイラスト'],['other','その他','備考欄にご記載ください']],
  speed:[['rush','緊急','依頼料+特急料金(元値の50%)の増額になります'],['normal','通常'],['long','長期','※62日以降(減額いたします)']],
  gender:[['male','男性'],['female','女性'],['none','無性別']],
  size:[['face','フェイスアップ','顔まわりを大きく描いた絵'],['bust','バストアップ','胸から上を描いた絵'],['full','全身','頭からつま先まで描いた絵']],
  usage:[['youtube','YouTube'],['twitch','Twitch'],['iriam','IRIAM'],['other','その他','備考欄にご記載ください']],
  refs:[['ok','確認した']],
  pay:[['bank','銀行振込'],['amazon','Amazonギフト券'],['coconala','ココナラ','外部サイト']],
  comm:[['yes','はい'],['no','いいえ']],
  ack:[['ok','承知した']]
};
const LBL = {};
Object.keys(OPT).forEach(k=>{LBL[k]={};OPT[k].forEach(o=>{LBL[k][o[0]]=o[1];});});
const SPEED_TXT = {rush:'緊急(特急料金:元値の50%を加算)',normal:'通常',long:'長期(62日以降・減額)'};

/* ====== 小さな道具 ====== */
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 文節の切れ目に<wbr>を入れて返す(表示用に文字もエスケープする) */
const HIRA=/[ぁ-ゟ]/, KANJI=/[一-鿿々〆]/, KATA=/[ァ-ヺー]/, ALNUM=/[0-9A-Za-z]/;
function jp(s){
  s = String(s==null?'':s);
  let out = '', start = 0;
  for(let i=1;i<s.length;i++){
    const p = s[i-1], c = s[i];
    let br = false;
    if('、。！？'.includes(p)) br = !'」』)）'.includes(c);
    else if(')）」』〜'.includes(p)) br = !'、。,.!?！？)）」』〜'.includes(c);
    else if('(（「『'.includes(c)) br = HIRA.test(p);
    else if(HIRA.test(p) && (KANJI.test(c)||KATA.test(c)||ALNUM.test(c))){
      let rs = i-1; while(rs>0 && HIRA.test(s[rs-1])) rs--;
      const run = s.slice(rs,i);
      br = !/^(お|ご|この|その|あの|どの)$/.test(run);
    }
    if(br){ out += esc(s.slice(start,i))+'<wbr>'; start = i; }
  }
  return out + esc(s.slice(start));
}
const yen = v => '¥' + Number(v).toLocaleString('ja-JP');
const WD = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const isoOf = (y,m0,d) => y+'-'+pad(m0+1)+'-'+pad(d);
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  return y+'年'+m+'月'+d+'日('+WD[new Date(y,m-1,d).getDay()]+')';
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'),2200);
}

/* ====== 状態 ====== */
const S = {
  i:0, mode:'form', text:'', cal:null, timer:null,
  a:{type:null,speed:null,date:null,gender:null,sdetail:'',size:null,idetail:'',usage:null,refs:null,pay:null,budget:null,comm:null,remarks:'',ack:null,agree:false}
};
function route(){
  const r = ['start','type','speed','date'];
  if(S.a.type==='standing') r.push('gender','sdetail');
  if(S.a.type==='illust') r.push('size','idetail');
  r.push('usage','refs','pay','budget','comm','remarks','ack','confirm');
  return r;
}
function makePayload(){
  const a = S.a;
  const p = {v:1,t:a.type,k:a.speed,d:a.date,u:a.usage,p:a.pay,b:a.budget,m:a.comm,a:a.ack,n:a.remarks.trim(),c:Date.now()};
  if(a.type==='standing'){p.g=a.gender;p.x=a.sdetail.trim();}
  if(a.type==='illust'){p.s=a.size;p.x=a.idetail.trim();}
  return p;
}
function guideFor(){ return GUIDE; }
function statusOf(v,g){ return v<g[0]?'low':(v>g[1]?'high':'in'); }
const STAT_TXT = {low:'目安より低めです。内容によっては調整をお願いする場合があります。',in:'目安の範囲内です。',high:'目安より高めです。'};

function rowsOf(p){
  const rows = [];
  rows.push({key:'type',label:'依頼物',text:LBL.type[p.t]+(p.t==='illust'&&p.s?'(' + LBL.size[p.s] + ')':'')});
  rows.push({key:'speed',label:'納期設定',text:SPEED_TXT[p.k]||'—'});
  rows.push({key:'date',label:'納期の希望',text:fmtDate(p.d)});
  if(p.t==='standing') rows.push({key:'gender',label:'立ち絵の性別',text:LBL.gender[p.g]||'—'});
  if(p.t==='standing'||p.t==='illust') rows.push({key:p.t==='standing'?'sdetail':'idetail',label:p.t==='standing'?'立ち絵の詳細':'1枚絵の詳細',text:p.x||'—'});
  rows.push({key:'usage',label:'使用用途',text:LBL.usage[p.u]||'—'});
  rows.push({key:'refs',label:'参考資料',text:'確認済み(DMにて送付)'});
  rows.push({key:'pay',label:'お支払いの希望',text:LBL.pay[p.p]||'—'});
  rows.push({key:'budget',label:'ご予算',text:yen(p.b)});
  rows.push({key:'comm',label:'主目的以外の商用利用',text:(LBL.comm[p.m]||'—')+(p.m==='yes'?'(金額に加算される場合があります)':'')});
  rows.push({key:'remarks',label:'備考',text:p.n||'なし'});
  rows.push({key:'ack',label:'利用規約の事前確認',text:p.a==='ok'?'承知した':'—'});
  return rows;
}
function toText(p){
  return '【イラスト依頼の見積もりアンケート】\n' + rowsOf(p).map(r=>r.label+':'+r.text).join('\n')
    + '\n\n※見積もりアンケートの回答です。依頼の確定ではありません。';
}

/* ====== 描画 ====== */
const stage = $('#stage');
function STEPS(){
  return {
    start:{title:''},
    type:{q:1,title:'依頼物の種類を選択してください',radio:'type'},
    speed:{q:1,title:'納期設定について選択してください',radio:'speed'},
    date:{q:1,title:'納期はいつ頃を希望ですか',note:dateNote()},
    gender:{q:1,title:'立ち絵の性別を選択してください',radio:'gender'},
    sdetail:{q:1,title:'立ち絵の詳細を教えてください',note:'衣装の雰囲気や欠かせない要素を、できるだけ細かく記載してください。',text:'sdetail',ph:'例)和風のジャケットを着ている。髪は青のロングで、ヘッドホンは必ず付けたい。',max:1000,need:true},
    size:{q:1,title:'希望の1枚絵を選択してください',radio:'size'},
    idetail:{q:1,title:'1枚絵の詳細を教えてください',note:'情景や、欠かせない要素を、できるだけ細かく記載してください。',text:'idetail',ph:'例)夕方の海辺で振り返っている。夕焼けと、風になびく髪を入れたい。',max:1000,need:true},
    usage:{q:1,title:'使用用途を選択してください',radio:'usage'},
    refs:{q:1,title:'参考の資料があればDMにて送付してください',note:'生成AIを用いて生成したものは、送付をお控えください。',radio:'refs'},
    pay:{q:1,title:'お支払い方法の希望を選択してください',note:'実際のお支払いに関するやり取りは第1ラフ提出後になりますので、現状の希望だけご選択ください。',radio:'pay'},
    budget:{tag:'ご予算',title:'ご予算を教えてください',note:'バーを動かして、1,000円単位で調整できます。金額に迷う場合は、当方の依頼料の目安を参考にしてください。'},
    comm:{q:1,title:'YouTube等主目的以外に、グッズ展開などの商用利用の可能性は考えていますか',note:'はいを選択した場合、金額に加算される場合があります。',radio:'comm'},
    remarks:{tag:'備考',title:'備考・ご質問があれば書いてください',note:'特殊な事情やご質問があれば、自由に記載してください。なければ空欄で大丈夫です。',text:'remarks',ph:'例)権利についての不明点など',max:1000},
    ack:{q:1,title:'この後表示される利用規約は、必ず全文ご確認ください。',note:'利用規約に反した場合、いかなる理由があってもこちらの措置に応じていただきます。',radio:'ack'},
    confirm:{tag:'確認',title:'内容を確認してください'}
  };
}
function setProgress(total){
  const p = $('#prog');
  p.hidden = false;
  p.innerHTML = Array.from({length:total},(_,k)=>'<span class="'+(k<S.i?'on':'')+'"></span>').join('');
  const c = $('#stepcount'); c.hidden = false; c.textContent = S.i+' / '+total;
}
function hideProgress(){ $('#prog').hidden = true; $('#stepcount').hidden = true; }
function needRemark(){ return S.a.type==='other' || S.a.usage==='other'; }

function radioBody(f){
  return '<div class="opts" role="radiogroup" aria-labelledby="qtitle">' + OPT[f].map(o=>{
    const on = S.a[f]===o[0];
    return '<label class="opt'+(on?' is-on':'')+'"><input type="radio" name="'+f+'" value="'+o[0]+'" data-radio="'+f+'"'+(on?' checked':'')+'>'
      +'<span class="dot" aria-hidden="true"></span><span class="otxt"><b>'+jp(o[1])+'</b>'+(o[2]?'<small>'+jp(o[2])+'</small>':'')+'</span></label>';
  }).join('') + '</div>';
}
function textBody(st){
  const warn = (st.text==='remarks' && needRemark()) ? '<p class="req">'+jp('「その他」を選んだ項目があります。ご希望の内容をこの欄に記載してください。')+'</p>' : '';
  return warn + '<textarea id="ta" class="ta" maxlength="'+st.max+'" placeholder="'+esc(st.ph)+'">'+esc(S.a[st.text])+'</textarea>'
    + '<div class="tcount"><span id="tcnt">'+S.a[st.text].length+'</span> / '+st.max+'</div>';
}
function navHtml(opts){
  const back = S.i>0 ? '<button type="button" class="btn btn-ghost" id="btn-back">戻る</button>' : '';
  const next = opts.next===false ? '' : '<button type="button" class="btn btn-primary" id="btn-next"'+(opts.disabled?' disabled':'')+'>'+(opts.label||'次へ')+'</button>';
  return '<div class="nav">'+back+next+'</div>';
}

function render(){
  if(S.mode==='done') return renderDone();
  const r = route(), key = r[S.i], st = STEPS()[key];
  if(key==='start'){ renderStart(); return; }
  setProgress(r.length-1);
  const qkeys = r.filter(k=>STEPS()[k].q);
  const tag = st.q ? 'Q'+(qkeys.indexOf(key)+1) : st.tag;
  let body = '', nav = '';
  if(st.radio){
    body = radioBody(st.radio);
    nav = navHtml({next:!!S.a[st.radio]});
  }else if(key==='date'){
    body = '<div class="cal" id="cal"></div><p class="picked" id="picked"></p>';
    nav = navHtml({disabled:!S.a.date});
  }else if(st.text){
    body = textBody(st);
    const ok = st.need ? !!S.a[st.text].trim() : (st.text==='remarks'&&needRemark() ? !!S.a.remarks.trim() : true);
    nav = navHtml({disabled:!ok});
  }else if(key==='budget'){
    body = budgetBody();
    nav = navHtml({});
  }else if(key==='confirm'){
    body = confirmBody();
    nav = '<div class="nav"><button type="button" class="btn btn-ghost" id="btn-back">戻る</button></div>';
  }
  stage.innerHTML = '<section class="step enter" data-key="'+key+'">'
    +'<div class="qno">'+esc(tag)+'</div><h2 class="qtitle" id="qtitle" tabindex="-1">'+jp(st.title)+'</h2>'
    +(st.note?'<p class="qnote">'+jp(st.note)+'</p>':'')
    +'<div class="qbody">'+body+'</div>'+nav+'</section>';
  after(key,st);
  window.scrollTo(0,0);
  const t = $('#qtitle'); if(t) t.focus({preventScroll:true});
}

/* 最初のページ */
function renderStart(){
  hideProgress();
  stage.innerHTML = '<section class="step enter"><div class="qno">はじめに</div>'
    +'<h2 class="qtitle" id="qtitle" tabindex="-1">'+jp('見積もりアンケートを作成します')+'</h2>'
    +'<p class="qnote">'+jp('はじめての方も大丈夫です。質問に答えていくだけで、依頼内容と希望予算がまとまります。')+'</p>'
    +'<div class="callout"><b>ご注意</b>'+jp(NOTICE)+'</div>'
    +'<ol class="flow">'
    +'<li><div><b>'+jp('質問に答える')+'</b><span>'+jp('選ぶだけで次に進みます。')+'</span></div></li>'
    +'<li><div><b>'+jp('確定してテキストを作る')+'</b><span>'+jp('回答をまとめた文章ができます。')+'</span></div></li>'
    +'<li><div><b>'+jp('テキストをDMで送る')+'</b><span>'+jp('こちらで内容を確認し、見積もりをお伝えします。')+'</span></div></li>'
    +'</ol>'
    +'<div class="nav"><button type="button" class="btn btn-primary btn-block" id="btn-start">見積もりアンケートの作成を開始</button></div></section>';
  window.scrollTo(0,0);
  const t = $('#qtitle'); if(t) t.focus({preventScroll:true});
}

function after(key,st){
  if(key==='date'){
    if(!S.cal){ const b = S.a.date? S.a.date.split('-').map(Number) : null; const mn = rangeBounds().min; S.cal = b?{y:b[0],m:b[1]-1}:{y:mn.getFullYear(),m:mn.getMonth()}; }
    drawCal();
  }
  if(st.text){
    const ta = $('#ta');
    ta.addEventListener('input',()=>{
      S.a[st.text] = ta.value; $('#tcnt').textContent = ta.value.length;
      const ok = st.need ? !!ta.value.trim() : (st.text==='remarks'&&needRemark() ? !!ta.value.trim() : true);
      $('#btn-next').disabled = !ok;
    });
  }
  if(key==='budget'){
    if(S.a.budget==null){ const g = guideFor(makePayload()); S.a.budget = Math.min(SL_MAX,Math.max(SL_MIN,Math.round((g[0]+g[1])/2/SL_STEP)*SL_STEP)); }
    setBudget(S.a.budget);
    $('#range').addEventListener('input',e=>setBudget(Number(e.target.value)));
  }
  if(key==='confirm'){
    const ag = $('#agree'), fin = $('#finish');
    ag.addEventListener('change',()=>{S.a.agree = ag.checked; fin.disabled = !ag.checked;});
    fin.addEventListener('click',finish);
  }
}

/* カレンダー */
function rangeBounds(){
  const r = RANGE[S.a.speed] || [1,Infinity], t = new Date();
  t.setHours(0,0,0,0);
  const min = new Date(t.getFullYear(),t.getMonth(),t.getDate()+r[0]);
  const max = isFinite(r[1]) ? new Date(t.getFullYear(),t.getMonth(),t.getDate()+r[1]) : null;
  return {min:min,max:max,r:r};
}
const isoD = d => isoOf(d.getFullYear(),d.getMonth(),d.getDate());
function dateNote(){
  if(!S.a.speed) return '';
  const b = rangeBounds(), lab = LBL.speed[S.a.speed];
  if(!b.max) return lab+'の場合は、'+b.r[0]+'日後以降('+fmtDate(isoD(b.min))+'以降)から選べます。';
  return lab+'の場合は、'+b.r[0]+'日後〜'+b.r[1]+'日後('+fmtDate(isoD(b.min))+'〜'+fmtDate(isoD(b.max))+')の間から選べます。'
    +(S.a.speed==='rush'?'7日以内の日付は選べません。':'');
}
function drawCal(){
  const y = S.cal.y, m = S.cal.m;
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const bd = rangeBounds(), lo = bd.min.getFullYear()*12+bd.min.getMonth();
  const hi = bd.max ? bd.max.getFullYear()*12+bd.max.getMonth() : lo+18, cur = y*12+m;
  let h = '<div class="cal-head"><button type="button" class="cal-nav" data-cal="-1" aria-label="前の月"'+(cur<=lo?' disabled':'')+'>‹</button>'
    +'<div class="cal-title">'+y+'年'+(m+1)+'月</div>'
    +'<button type="button" class="cal-nav" data-cal="1" aria-label="次の月"'+(cur>=hi?' disabled':'')+'>›</button></div><div class="cal-grid">';
  WD.forEach((w,k)=>{h += '<div class="wd'+(k===0?' sun':k===6?' sat':'')+'">'+w+'</div>';});
  for(let k=0;k<first;k++) h += '<div></div>';
  for(let d=1;d<=days;d++){
    const dt = new Date(y,m,d), iso = isoOf(y,m,d);
    const cls = 'day'+(dt.getTime()===today.getTime()?' today':'')+(S.a.date===iso?' sel':'');
    h += '<button type="button" class="'+cls+'" data-day="'+iso+'"'+(dt<bd.min||(bd.max&&dt>bd.max)?' disabled':'')+' aria-pressed="'+(S.a.date===iso)+'">'+d+'</button>';
  }
  $('#cal').innerHTML = h + '</div>';
  const pk = $('#picked');
  pk.className = 'picked'+(S.a.date?'':' empty');
  pk.textContent = S.a.date ? '選んだ日:' + fmtDate(S.a.date) : '日付をタップして選んでください';
}

/* 予算 */
function budgetBody(){
  const g = guideFor(makePayload());
  const ra = Math.min(1,Math.max(0,(g[0]-SL_MIN)/(SL_MAX-SL_MIN))), rb = Math.min(1,Math.max(0,(g[1]-SL_MIN)/(SL_MAX-SL_MIN)));
  return (S.a.speed==='rush'?'<p class="rushnote">'+jp('※特急料金が加算されることをご考慮のうえ、ご予算の設定をお願いします。')+'</p>':'')
    +'<div class="bud-row"><button type="button" class="stepper" data-bud="-1" aria-label="1,000円下げる">−</button>'
    +'<output id="bval" class="bval" for="range"></output>'
    +'<button type="button" class="stepper" data-bud="1" aria-label="1,000円上げる">＋</button></div>'
    +'<div class="slider" id="slider" style="--a:'+ra+';--b:'+rb+'"><input type="range" id="range" min="'+SL_MIN+'" max="'+SL_MAX+'" step="'+SL_STEP+'" value="'+(S.a.budget||SL_MIN)+'" aria-label="ご予算"><div class="band"></div></div>'
    +'<div class="scale"><span>'+yen(SL_MIN)+'</span><span>'+yen(SL_MAX)+'</span></div>'
    +'<p class="guide"><i></i>'+jp('当方の依頼料の目安は')+' <b>'+yen(g[0])+' 〜 '+yen(g[1])+'</b> です。</p>'
    +'<p class="bstat" id="bstat"></p>';
}
function setBudget(v){
  v = Math.min(SL_MAX,Math.max(SL_MIN,v)); S.a.budget = v;
  const g = guideFor(makePayload()), st = statusOf(v,g);
  $('#bval').textContent = yen(v);
  $('#range').value = v;
  $('#slider').style.setProperty('--pct',((v-SL_MIN)/(SL_MAX-SL_MIN)*100)+'%');
  const b = $('#bstat'); b.className = 'bstat st-'+st; b.innerHTML = jp(STAT_TXT[st]);
}

/* 確認 */
function confirmBody(){
  const rows = rowsOf(makePayload());
  return '<ul class="sum">'+rows.map(r=>'<li><div class="sc"><div class="sk">'+r.label+'</div><p class="sv">'+jp(r.text)+'</p></div><button type="button" class="link-btn" data-goto="'+r.key+'">変更</button></li>').join('')+'</ul>'
    +'<section class="terms"><h3>納品物に関する利用規約</h3><ol>'+TERMS.map(t=>'<li>'+jp(t)+'</li>').join('')+'</ol></section>'
    +'<label class="agree"><input type="checkbox" id="agree"'+(S.a.agree?' checked':'')+'><span>利用規約に同意します</span></label>'
    +'<div class="callout"><b>ご注意</b>'+jp(NOTICE)+'</div>'
    +'<div class="callout"><b>お支払い期日について</b>'+jp('お支払いは原則ラフ提出後14日以内としていますが、特別な事情で支払い期日が遅れる可能性のある場合は直接ご相談ください。')+'</div>'
    +'<div class="nav" style="margin-top:16px"><button type="button" class="btn btn-primary btn-block" id="finish"'+(S.a.agree?'':' disabled')+'>この内容で確定してテキストを作る</button></div>';
}
async function finish(){
  const p = makePayload();
  S.text = toText(p);
  S.mode = 'done';
  render();
}

/* 完成画面 */
function renderDone(){
  hideProgress();
  stage.innerHTML = '<section class="step enter"><div class="qno">完了</div><h2 class="qtitle" id="qtitle" tabindex="-1">'+jp('回答がまとまりました')+'</h2>'
    +'<div class="callout"><b>'+jp('このテキストをDMで送ってください')+'</b>'+jp('下のボタンでコピーして、そのままDMに貼り付けてください。')+'</div>'
    +'<p class="infobox">'+jp('参考資料がある場合は、このテキストと一緒にDMで送ってください。')+'</p>'
    +'<div class="stack"><textarea id="textbox" class="linkbox textbox" rows="12" readonly aria-label="DMに貼り付けるテキスト">'+esc(S.text)+'</textarea>'
    +'<button type="button" class="btn btn-primary btn-block" id="copy-text">テキストをコピー</button>'
    +'<button type="button" class="btn btn-ghost btn-block" id="edit-again">内容を修正する</button></div></section>';
  window.scrollTo(0,0);
  const t = $('#qtitle'); if(t) t.focus({preventScroll:true});
}
async function copyOut(text,el,okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); return; }catch(e){}
  try{ el.focus(); el.select(); if(document.execCommand('copy')){ toast(okMsg); return; } }catch(e){}
  toast('選択しました。長押しでコピーしてください');
}

/* ====== イベント ====== */
function advance(){ S.i = Math.min(S.i+1,route().length-1); render(); }
stage.addEventListener('click',e=>{
  const t = e.target;
  if(t.matches && t.matches('input[data-radio]')){
    const f = t.dataset.radio;
    S.a[f] = t.value;
    if(f==='speed'){
      const bd = rangeBounds();
      if(S.a.date){ const q = S.a.date.split('-').map(Number), dt = new Date(q[0],q[1]-1,q[2]); if(dt<bd.min||(bd.max&&dt>bd.max)) S.a.date = null; }
      S.cal = null;
    }
    stage.querySelectorAll('.opt').forEach(l=>l.classList.toggle('is-on',l.querySelector('input').checked));
    const key = route()[S.i];
    clearTimeout(S.timer);
    S.timer = setTimeout(()=>{ if(S.mode==='form' && route()[S.i]===key) advance(); },260);
    return;
  }
  const c = t.closest('[data-cal]');
  if(c){
    let m = S.cal.m + Number(c.dataset.cal), y = S.cal.y;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    S.cal = {y:y,m:m}; drawCal(); return;
  }
  const d = t.closest('[data-day]');
  if(d){ S.a.date = d.dataset.day; drawCal(); $('#btn-next').disabled = false; return; }
  const bu = t.closest('[data-bud]');
  if(bu){ setBudget(S.a.budget + Number(bu.dataset.bud)*SL_STEP); return; }
  const go = t.closest('[data-goto]');
  if(go){ const k = route().indexOf(go.dataset.goto); if(k>=0){ S.i = k; render(); } return; }
  const id = t.closest('button') && t.closest('button').id;
  if(id==='btn-back'){ S.i = Math.max(0,S.i-1); render(); }
  else if(id==='btn-next'||id==='btn-start'){ advance(); }
  else if(id==='copy-text'){ copyOut(S.text,$('#textbox'),'テキストをコピーしました'); }
  else if(id==='edit-again'){ S.mode='form'; S.i = route().length-1; render(); }
});
$('#stage').addEventListener('focusin',e=>{ if(e.target.id==='linkbox'||e.target.id==='textbox') e.target.select(); });

/* ====== 起動 ====== */
S.mode = 'form'; render();
})();
</script>

</body></html>
